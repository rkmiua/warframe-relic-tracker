# 旧アドレス（GitHub Pages）を開いた人を、いまのアドレスへ送るだけのページを置く。
# アプリ本体は Firebase Hosting から配信している（npm run deploy）。
name: Redirect old address

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deploy
        uses: actions/deploy-pages@v4
